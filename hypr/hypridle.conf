general {
    lock_cmd = hyprlock
    before_sleep_cmd = hyprlock
    after_sleep_cmd = sleep 1
    inhibit_sleep = 3
}
listener {
    timeout = 300
    on-timeout = /home/felix/.config/screensaver/omarchy-launch-screensaver
    condition_cmd = ! playerctl -a status 2>/dev/null | grep -q Playing
    condition_retry = 30
}
listener {
    timeout = 600
    on-timeout = hyprlock
    condition_cmd = ! playerctl -a status 2>/dev/null | grep -q Playing
    condition_retry = 30
}
